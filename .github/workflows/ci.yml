name: Kairo CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint Check
        run: |
          ruff check backend

      - name: Run Ruff Format Check
        run: |
          ruff format --check backend

  backend-test:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio anyio

      - name: Run Pytest Suite
        env:
          ENVIRONMENT: testing
          OPENROUTER_API_KEY: test-openrouter-key-mock
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: backend
        run: |
          pytest backend/tests -ra -v

  frontend-check:
    name: Frontend Test & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: |
          npm test

      - name: Verify Frontend Production Build
        working-directory: ./frontend
        run: |
          npm run build

  rust-substrate:
    name: Native Rust Substrate Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run Cargo Format Check
        working-directory: ./native
        run: cargo fmt --check

      - name: Run Cargo Clippy
        working-directory: ./native
        run: cargo clippy --workspace -- -D warnings

      - name: Run Cargo Tests
        working-directory: ./native
        run: cargo test --workspace
