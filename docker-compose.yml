services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kairo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kairo}
      POSTGRES_USER: ${POSTGRES_USER:-kairo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kairo_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kairo} -d ${POSTGRES_DB:-kairo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: kairo_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    container_name: kairo_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-kairo}:${POSTGRES_PASSWORD:-kairo_secret}@postgres:5432/${POSTGRES_DB:-kairo}
      - REDIS_URL=redis://redis:6379/0
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:-default_insecure_auth_secret_key_32_characters}
      - SECRET_KEY=${SECRET_KEY:-default_system_secret_key_32_characters}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - KAIRO_COMPUTER_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.worker
    container_name: kairo_worker
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-kairo}:${POSTGRES_PASSWORD:-kairo_secret}@postgres:5432/${POSTGRES_DB:-kairo}
      - REDIS_URL=redis://redis:6379/0
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:-default_insecure_auth_secret_key_32_characters}
      - SECRET_KEY=${SECRET_KEY:-default_system_secret_key_32_characters}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - KAIRO_COMPUTER_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
