services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: kairo_backend
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

