[package]
name = "kairo-protocol"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Strongly-typed IPC protocol envelopes, error models, and capability descriptors for Kairo native runtime"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"

[dev-dependencies]
serde_test = "1.0"
